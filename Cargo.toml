[package]
name = "rookdb-cli"
version = "0.1.0"
edition = "2024"
authors = ["RookDB"]
description = "An interactive SQL CLI for RookDB — query your database from the terminal"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/RookDB/rookdb-cli"
homepage = "https://rookdb.github.io/docs/CLI"
keywords = ["database", "sql", "cli", "rookdb", "repl"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "rookdb"
path = "src/main.rs"

[dependencies]
rook-ast = { path = "../rook-ast" }
rook-parser = { path = "../rook-parser" }
storage_manager = { path = "../RookDB" }
serde_json = "1.0.150"
serde = "1.0.228"
